<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>{{profile_name}} — {{profile_title}}</title>
    <meta name="description" content="{{profile_description}}" />
    <meta property="og:title" content="{{profile_name}} — {{profile_title}}" />
    <meta property="og:description" content="{{profile_description}}" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Runs before first paint so there is no flash of the wrong theme.
      // Must stay in sync with THEME_STORAGE_KEY in src/theme/theme_context.js.
      (function apply_initial_theme() {
        var root_element = document.documentElement;
        try {
          var stored_theme = window.localStorage.getItem("theme");
          if (stored_theme === "light" || stored_theme === "dark") {
            root_element.dataset.theme = stored_theme;
            return;
          }
          var prefers_light = window.matchMedia("(prefers-color-scheme: light)").matches;
          root_element.dataset.theme = prefers_light ? "light" : "dark";
        } catch (error) {
          root_element.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">
        This site needs JavaScript to render. You can reach {{profile_name}} at
        <a href="mailto:{{profile_email}}">{{profile_email}}</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
